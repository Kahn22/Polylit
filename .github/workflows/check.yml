name: checks

on:
  push:
    branches: [main, 'editorial/**', 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:local-review
      - name: Editorial audit and release gate
        run: node scripts/editorial-ci-report.mjs
